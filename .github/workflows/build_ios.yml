name: Build & Upload iOS to App Store Connect

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # fastlane match stores certs on the 'certificates' branch
  id-token: write

jobs:
  build-and-upload:
    name: Build & Upload iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Ruby environment
        working-directory: mobile/ios
        run: |
          gem install bundler
          bundle config path vendor/bundle
          export LANG=en_US.UTF-8

      - name: Bundle install (fastlane)
        working-directory: mobile/ios
        run: bundle install

      - name: fastlane match + build + upload to TestFlight
        working-directory: mobile/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          export LANG=en_US.UTF-8
          bundle exec fastlane release
