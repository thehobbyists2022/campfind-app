name: Deploy iOS to App Store Connect

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-ios:
    name: Build & Upload to App Store Connect
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Flutter iOS Bundle
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Set up Fastlane
        working-directory: mobile/ios
        run: gem install bundler fastlane

      - name: Build & Upload via Fastlane
        working-directory: mobile/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: fastlane release
