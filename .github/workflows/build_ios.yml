name: Build & Upload iOS to App Store Connect

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # required for fastlane match to store certs in the signing git repo

jobs:
  build-and-upload:
    name: Build & Upload iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Ruby + Bundler
        run: |
          gem install bundler
          bundle config path vendor/bundle

      - name: Bundle install (fastlane)
        working-directory: mobile/ios
        run: bundle install

      - name: Fastlane match + build + upload (reuses signing cert)
        working-directory: mobile/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: "false"
        run: |
          export LANG=en_US.UTF-8
          bundle exec fastlane release
