name: Check TestFlight Build Status

on:
  workflow_dispatch:

jobs:
  check:
    name: Query latest TestFlight build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query TestFlight builds via App Store Connect API
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 scripts/check_asc.py
