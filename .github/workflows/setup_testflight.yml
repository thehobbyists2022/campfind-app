name: Setup TestFlight Tester

on:
  workflow_dispatch:

jobs:
  setup:
    name: Add tester & build to TestFlight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cryptography
        run: pip install --quiet cryptography
      - name: Run tester setup
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TESTER_EMAIL: clarityclinicalsolutions@gmail.com
        run: python3 scripts/setup_testflight.py
