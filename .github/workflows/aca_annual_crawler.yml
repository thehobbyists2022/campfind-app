name: ACA Annual Camp Data Auto-Sync

on:
  schedule:
    # Automatically run on March 1st and May 1st at 00:00 UTC every year
    - cron: '0 0 1 3,5 *'
  # Allows manual execution anytime via GitHub Actions button
  workflow_dispatch:

jobs:
  sync-camp-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACA Camp Data Sync & Expansion
        run: |
          python scrapers/05_expand_and_enrich_camps.py

      - name: Commit and Push Updated Camp Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add app/aca_camps.json app/aca_camps_data.js
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: annual update ACA camp dataset for $(date +'%Y-%m')"
          git push
