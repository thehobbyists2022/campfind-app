<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CampFind — Find the perfect summer camp</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #FF6B6B;
            --primary-light: #ff8e8e;
            --primary-dark: #e55555;
            --secondary: #4ECDC4;
            --secondary-light: #7eddd6;
            --secondary-dark: #3ab5ad;
            --accent: #2C3E50;
            --accent-light: #3d566e;
            --accent-dark: #1a252f;
            --bg: #FFFFFF;
            --bg-alt: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #5a6a7c;
            --text-light: #8a9aa8;
            --shadow-sm: 0 2px 8px rgba(44, 62, 80, 0.08);
            --shadow-md: 0 8px 30px rgba(44, 62, 80, 0.12);
            --shadow-lg: 0 20px 60px rgba(44, 62, 80, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image: radial-gradient(ellipse at 20% 0%, rgba(78, 205, 196, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(255, 107, 107, 0.05) 0%, transparent 60%),
                repeating-linear-gradient(45deg, rgba(44, 62, 80, 0.01) 0px, rgba(44, 62, 80, 0.01) 1px, transparent 1px, transparent 20px);
            background-attachment: fixed;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px 60px;
            position: relative;
        }

        /* ---- HEADER ---- */
        .header {
            text-align: center;
            padding: 32px 0 28px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--secondary), var(--primary), transparent);
            border-radius: 2px;
            opacity: 0.3;
        }

        .app-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .app-logo h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-logo .emoji-logo {
            font-size: 2.4rem;
            line-height: 1;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .tagline span {
            display: inline-block;
        }

        /* ---- SEARCH SECTION ---- */
        .search-section {
            margin: 28px auto 0;
            max-width: 820px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 24px 28px 28px;
            border: 1px solid rgba(78, 205, 196, 0.08);
            transition: var(--transition);
        }

        .search-section:hover {
            box-shadow: var(--shadow-lg);
        }

        .search-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .search-field {
            flex: 2;
            min-width: 180px;
        }

        .age-field {
            flex: 1.2;
            min-width: 160px;
        }

        .filter-field {
            flex: 0.8;
            min-width: 120px;
        }

        .search-field label,
        .age-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            font-size: 1.1rem;
            opacity: 0.7;
            pointer-events: none;
        }

        .input-wrapper input[type="text"] {
            width: 100%;
            padding: 13px 14px 13px 44px;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: var(--font);
            background: var(--bg-alt);
            color: var(--text);
            transition: var(--transition);
            outline: none;
            font-weight: 500;
        }

        .input-wrapper input[type="text"]:focus {
            border-color: var(--secondary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.15);
        }

        .input-wrapper input[type="text"]::placeholder {
            color: var(--text-light);
            font-weight: 400;
        }

        /* Age slider */
        .age-display {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .age-display .age-value {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
            min-width: 36px;
            text-align: center;
            background: rgba(255, 107, 107, 0.1);
            padding: 2px 6px;
            border-radius: var(--radius-xs);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            outline: none;
            transition: var(--transition);
            cursor: pointer;
            flex: 1;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg);
            border: 3px solid var(--primary);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
            transition: var(--transition);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.12);
            border-color: var(--primary-dark);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg);
            border: 3px solid var(--primary);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
        }

        input[type="range"]:focus::-webkit-slider-thumb {
            box-shadow: 0 0 0 6px rgba(255, 107, 107, 0.15);
        }

        /* Filter buttons */
        .filter-btns {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            flex: 1;
            padding: 11px 10px;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius-sm);
            background: var(--bg-alt);
            font-family: var(--font);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: var(--secondary);
            color: var(--accent);
            background: #fff;
        }

        .filter-btn.active {
            background: var(--secondary);
            border-color: var(--secondary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(78, 205, 196, 0.3);
        }

        .filter-btn.active:hover {
            background: var(--secondary-dark);
            border-color: var(--secondary-dark);
        }

        /* ---- RESULTS HEADER ---- */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 32px 0 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .results-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .results-header h2 span {
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .results-count {
            background: rgba(44, 62, 80, 0.06);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            background: var(--bg-alt);
            border-radius: var(--radius);
            border: 2px dashed #e2e8f0;
            margin-top: 8px;
        }

        .no-results .big-emoji {
            font-size: 3.4rem;
            display: block;
            margin-bottom: 16px;
        }

        .no-results h3 {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .no-results p {
            font-size: 0.95rem;
            max-width: 400px;
            margin: 0 auto;
        }

        /* ---- CAMP GRID ---- */
        .camp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 6px;
        }

        /* ---- CAMP CARD ---- */
        .camp-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(44, 62, 80, 0.06);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .camp-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-4px);
            border-color: rgba(78, 205, 196, 0.15);
        }

        .camp-card-inner {
            padding: 20px 22px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .camp-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .camp-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.3;
            flex: 1;
        }

        .favorite-btn {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            transition: var(--transition);
            flex-shrink: 0;
            margin-top: -2px;
            color: #d0d8e0;
            filter: grayscale(1);
            opacity: 0.6;
        }

        .favorite-btn:hover {
            transform: scale(1.2);
        }

        .favorite-btn.favorited {
            color: var(--primary);
            filter: grayscale(0);
            opacity: 1;
            animation: heartPop 0.35s ease;
        }

        @keyframes heartPop {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.4);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        .camp-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-top: 10px;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .camp-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .camp-meta-item .emoji {
            font-size: 0.9rem;
        }

        .camp-type-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: rgba(78, 205, 196, 0.12);
            color: var(--secondary-dark);
        }

        .camp-type-badge.overnight {
            background: rgba(44, 62, 80, 0.08);
            color: var(--accent-light);
        }

        .camp-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .camp-rating .stars {
            color: #f8b84a;
            letter-spacing: 1px;
            font-size: 0.95rem;
        }

        .camp-rating .rating-count {
            color: var(--text-light);
            font-size: 0.8rem;
            margin-left: 2px;
        }

        .camp-price {
            font-weight: 700;
            color: var(--accent);
            font-size: 1rem;
        }

        .camp-price small {
            font-weight: 400;
            color: var(--text-light);
            font-size: 0.75rem;
        }

        .availability-dot {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .availability-dot .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .availability-dot .dot.available {
            background: #2ecc71;
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.3);
        }

        .availability-dot .dot.limited {
            background: #f39c12;
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.3);
        }

        .availability-dot .dot.full {
            background: #e74c3c;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.3);
        }

        /* Expanded details */
        .camp-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            padding: 0 22px;
            background: var(--bg-alt);
            border-top: 1px solid transparent;
        }

        .camp-card.expanded .camp-details {
            max-height: 600px;
            opacity: 1;
            padding: 18px 22px 22px;
            border-top-color: rgba(78, 205, 196, 0.1);
        }

        .camp-details-inner {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .camp-details-inner h4 {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .sessions-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sessions-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            padding: 6px 12px;
            background: var(--card-bg);
            border-radius: var(--radius-xs);
            border: 1px solid rgba(44, 62, 80, 0.04);
        }

        .sessions-list .session-date {
            font-weight: 500;
            color: var(--accent);
        }

        .sessions-list .session-price {
            font-weight: 600;
            color: var(--primary-dark);
        }

        .contact-info {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .contact-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .expand-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed rgba(44, 62, 80, 0.06);
            transition: var(--transition);
        }

        .camp-card.expanded .expand-hint {
            opacity: 0;
        }

        .expand-hint span {
            display: inline-block;
            transition: var(--transition);
        }

        .camp-card:not(.expanded) .expand-hint span {
            animation: bounceHint 2s ease-in-out infinite;
        }

        @keyframes bounceHint {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(4px);
            }
        }

        /* ---- FOOTER ---- */
        .footer {
            text-align: center;
            padding: 40px 20px 10px;
            color: var(--text-light);
            font-size: 0.82rem;
            border-top: 1px solid rgba(44, 62, 80, 0.06);
            margin-top: 48px;
        }

        .footer .heart {
            color: var(--primary);
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 900px) {
            .app-container {
                padding: 16px 16px 40px;
            }

            .app-logo h1 {
                font-size: 2.2rem;
            }

            .search-section {
                padding: 20px 20px 24px;
                margin-top: 20px;
            }

            .search-row {
                flex-direction: column;
                gap: 14px;
            }

            .search-field,
            .age-field,
            .filter-field {
                min-width: 100%;
                width: 100%;
            }

            .filter-btns {
                width: 100%;
            }

            .camp-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 16px;
            }

            .results-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }

            .results-header h2 {
                font-size: 1.15rem;
            }
        }

        @media (max-width: 480px) {
            .app-logo h1 {
                font-size: 1.8rem;
            }

            .app-logo .emoji-logo {
                font-size: 1.8rem;
            }

            .tagline {
                font-size: 0.95rem;
            }

            .search-section {
                padding: 16px 16px 20px;
                border-radius: var(--radius-sm);
            }

            .camp-card-inner {
                padding: 16px 18px 14px;
            }

            .camp-details {
                padding: 0 18px;
            }

            .camp-card.expanded .camp-details {
                padding: 14px 18px 18px;
            }

            .camp-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .camp-name {
                font-size: 1.05rem;
            }

            .input-wrapper input[type="text"] {
                padding: 12px 14px 12px 40px;
                font-size: 0.95rem;
            }

            .header {
                padding: 20px 0 20px;
            }
        }

        @media (min-width: 1400px) {
            .app-container {
                max-width: 1320px;
            }

            .camp-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 24px;
            }
        }

        /* ---- UTILITIES ---- */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-alt);
        }

        ::-webkit-scrollbar-thumb {
            background: #c5cdd8;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #aab3c0;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- HEADER -->
        <header class="header">
            <div class="app-logo">
                <span class="emoji-logo" role="img" aria-label="camp">🏕️</span>
                <h1>CampFind</h1>
            </div>
            <p class="tagline"><span>Find the perfect summer camp near you</span></p>
        </header>

        <!-- SEARCH SECTION -->
        <section class="search-section" aria-label="Search and filter camps">

            <div class="search-row">

                <!-- ZIP -->
                <div class="search-field">
                    <label for="zipInput">📍 ZIP Code</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">📍</span>
                        <input type="text" id="zipInput" placeholder="e.g. 10001" maxlength="10" inputmode="numeric" pattern="[0-9]*" autocomplete="postal-code">
                    </div>
                </div>

                <!-- Age Slider -->
                <div class="age-field">
                    <label for="ageSlider">🎂 Max Age</label>
                    <div class="age-display">
                        <input type="range" id="ageSlider" min="4" max="18" value="14" step="1">
                        <span class="age-value" id="ageValue">14</span>
                    </div>
                </div>

                <!-- Filter -->
                <div class="filter-field">
                    <label>🏷️ Type</label>
                    <div class="filter-btns">
                        <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
                        <button class="filter-btn" data-filter="day" aria-pressed="false">Day</button>
                        <button class="filter-btn" data-filter="overnight" aria-pressed="false">Overnight</button>
                    </div>
                </div>

            </div>
        </section>

        <!-- RESULTS -->
        <div class="results-header">
            <h2>
                🏕️ Camps
                <span id="resultSubtitle">near you</span>
            </h2>
            <div class="results-count" id="resultsCount">0 camps</div>
        </div>

        <div id="campGrid" class="camp-grid" role="list" aria-label="Camp results"></div>

        <div id="noResults" class="no-results" style="display:none;">
            <span class="big-emoji" aria-hidden="true">🔍</span>
            <h3>No camps found</h3>
            <p>Try adjusting your search or age filter to see more results.</p>
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <p>CampFind &mdash; made with <span class="heart">❤️</span> for families &bull; 🏕️ Find your adventure</p>
        </footer>

    </div>

    <script>
