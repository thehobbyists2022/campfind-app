workflows:
  ios-release:
    name: iOS Release (App Store Connect / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: campfind_appstore
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.campfind.app
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Configure iOS version & set codesigning team
        script: |
          cd ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1.0" Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 20" Runner/Info.plist || true
          cd ..
      - name: Build App Store IPA
        script: |
          flutter build ipa --release \
            --build-name=1.1.0 \
            --build-number=20
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        beta_groups: []
