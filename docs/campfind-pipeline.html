<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampFind data pipeline — Diagram Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">CAMPFIND · DATA FLOW · DIAGRAM DESIGN</p>
    <h1>CampFind 5,000-camp pipeline</h1>

    <!-- viewBox 728x356: 3 lanes x 5 steps, 3-row legend -->
    <svg viewBox="0 0 728 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="campfind-data-flow-title campfind-data-flow-desc">
      <title id="campfind-data-flow-title">CampFind 5,000-camp pipeline</title>
      <desc id="campfind-data-flow-desc">Data-flow diagram showing official camp sources crawled by versioned scrapers, merged and validated into a 5,000-record dataset by v3_export.py, synced to three app copies, and shipped in the CampFind Flutter app release.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arr-muted"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6c36"/></marker>
        <marker id="arr-link"   markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2e5aa8"/></marker>
      </defs>

      <!-- background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- lane tints: odd-indexed lanes 0 (SRC) and 2 (SHP) -->
      <rect x="0" y="36" width="728" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="0" y="196" width="728" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- lane dividers -->
      <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <!-- label column border -->
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ============ ARROWS (before nodes) ============ -->
      <!-- A: SRC step0 bottom -> ENG step0 top (muted, same-step vertical) -->
      <line x1="196" y1="108" x2="196" y2="124" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>
      <!-- B: SRC step0 right -> merge top (ACCENT focal cross-role handoff) -->
      <path d="M246,76 H308 V124" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <!-- label mask beside vertical segment -->
      <rect x="318" y="84" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="346" y="92" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACCREDITED</text>
      <!-- C: scrapers right -> merge left (muted, same lane) -->
      <line x1="246" y1="156" x2="258" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>
      <!-- D: merge right -> validator left -->
      <line x1="358" y1="156" x2="370" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>
      <!-- E: validator right -> sync left -->
      <line x1="470" y1="156" x2="482" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>
      <!-- F: sync right -> app left (link: published) -->
      <path d="M582,156 H586 V236 H594" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arr-link)"/>

      <!-- ============ STEP HEADER CHIPS ============ -->
      <!-- 01 CRAWL -->
      <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="196" y="14" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="196" y="29" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRAWL</text>
      <!-- 02 MERGE (focal) -->
      <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,0.20)"/>
      <text x="308" y="14" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="308" y="29" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MERGE</text>
      <!-- 03 VALIDATE -->
      <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="420" y="14" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="420" y="29" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALIDATE</text>
      <!-- 04 SYNC -->
      <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="532" y="14" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="532" y="29" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
      <!-- 05 PUBLISH -->
      <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="644" y="14" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
      <text x="644" y="29" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUBLISH</text>

      <!-- ============ LANE LABELS ============ -->
      <text x="70" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CAMP</text>
      <text x="70" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SOURCES</text>
      <text x="70" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA</text>
      <text x="70" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PIPELINE</text>
      <text x="70" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APP</text>
      <text x="70" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHIP</text>

      <!-- ============ NODES ============ -->
      <!-- SRC step0: Official Sources -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="146" y="44" width="100" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.18)"/>
      <text x="159" y="55" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">SRC</text>
      <text x="196" y="67" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Official Sources</text>
      <text x="196" y="79" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">ACA finder · brand locators</text>
      <text x="196" y="91" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">server-side pages</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#6e6479"/>
      <text x="234" y="104" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">WB</text>

      <!-- ENG step0: Versioned Scrapers -->
      <rect x="146" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="146" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="150" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.18)"/>
      <text x="159" y="135" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">PL</text>
      <text x="196" y="147" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Versioned Scrapers</text>
      <text x="196" y="159" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">v1–v44 batches</text>
      <text x="196" y="171" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">scrapers/ · /tmp</text>
      <rect x="150" y="178" width="16" height="8" rx="3" fill="#6e6479"/>
      <text x="158" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">WB</text>
      <rect x="226" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="234" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>

      <!-- ENG step1: Merge Engine (FOCAL NODE) -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="258" y="124" width="100" height="64" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(235,108,54,0.18)"/>
      <text x="271" y="135" fill="#eb6c36" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">PL</text>
      <text x="308" y="147" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Merge Engine</text>
      <text x="308" y="159" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">v3_export.py · dedupe</text>
      <text x="308" y="171" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">44 batches → 5,000</text>
      <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="270" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>
      <rect x="338" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="346" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>

      <!-- ENG step2: Validator -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.18)"/>
      <text x="383" y="135" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">PL</text>
      <text x="420" y="147" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validator</text>
      <text x="420" y="159" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">lib_schema · state/zip</text>
      <text x="420" y="171" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">violations = 0</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="382" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="458" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>

      <!-- ENG step3: 3x Sync -->
      <rect x="482" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="482" y="124" width="100" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.18)"/>
      <text x="495" y="135" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">PL</text>
      <text x="532" y="147" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3× Sync</text>
      <text x="532" y="159" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">json · js · mobile asset</text>
      <text x="532" y="171" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">same records, 3 copies</text>
      <rect x="486" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="494" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>
      <rect x="562" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="570" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>

      <!-- SHP step4: Flutter App -->
      <rect x="594" y="204" width="100" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="594" y="204" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="598" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,0.18)"/>
      <text x="607" y="215" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">SHP</text>
      <text x="644" y="227" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flutter App</text>
      <text x="644" y="239" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">CampFind 1.0.14</text>
      <text x="644" y="251" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">AAB → Play (deferred)</text>
      <rect x="598" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="606" y="264" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>
      <rect x="674" y="258" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="682" y="264" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">FL</text>

      <!-- ============ LEGEND ============ -->
      <!-- separator -->
      <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="144" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEPS</text>
      <!-- step chips: CRAWL MERGE VALIDATE SYNC PUBLISH at x = 220, 322, 424, 526, 628 -->
      <rect x="220" y="296" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="228" y="304" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle">01</text>
      <text x="256" y="304" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">CRAWL</text>
      <rect x="322" y="296" width="32" height="16" rx="8" fill="rgba(235,108,54,0.20)"/>
      <text x="330" y="304" fill="#eb6c36" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle">02</text>
      <text x="358" y="304" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace">MERGE</text>
      <rect x="424" y="296" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="432" y="304" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle">03</text>
      <text x="460" y="304" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">VALIDATE</text>
      <rect x="526" y="296" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="534" y="304" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle">04</text>
      <text x="562" y="304" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">SYNC</text>
      <rect x="628" y="296" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="636" y="304" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle">05</text>
      <text x="664" y="304" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">PUBLISH</text>

      <text x="144" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DATA TYPE</text>
      <rect x="252" y="317" width="16" height="8" rx="3" fill="#6e6479"/>
      <text x="272" y="325" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">WEB</text>
      <rect x="324" y="317" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="344" y="325" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">DATASET</text>
      <rect x="416" y="317" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="436" y="325" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">FILE</text>
      <text x="480" y="325" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">left chip = input · right chip = output</text>

      <text x="144" y="346" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FLOW</text>
      <line x1="212" y1="342" x2="248" y2="342" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>
      <text x="254" y="346" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">hand-off</text>
      <line x1="312" y1="342" x2="348" y2="342" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <text x="354" y="346" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace">focal hand-off</text>
      <line x1="432" y1="342" x2="468" y2="342" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arr-link)"/>
      <text x="474" y="346" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace">published</text>
    </svg>
  </div>
</body>
</html>
